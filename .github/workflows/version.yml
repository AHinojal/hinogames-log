# Process name
name: Upgrade version web

# Branch being executed
on:
    push:
        branches:
            - develop

concurrency:
     group: versioning
     cancel-in-progress: true

# Permissions
permissions:
    contents: read

# Tasks
jobs:
    # Job's name: Build
    build:
        # Virtual machine
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v5
          # Get the complete historial and tags
          with:
            fetch-depth: 0
        # Install node
        - uses: actions/setup-node@v5
          with:
            node-version: 22
        # Gets and calculate the new tag
        - env:
            MESSAGE: ${{ github.event.head_commit.message }}
            # 1. Gets the version's type from the commit 
            # 2. npm calculates new version from package.json
            # 3. Do the new commit with the new version
          run: |
            if echo "$MESSAGE" | grep -q "#major"; then
                TYPE=major
            elif echo "$MESSAGE" | grep -q "#minor"; then
                TYPE=minor
            else
                TYPE=patch
            fi

            NEW=$(npm version "$TYPE" --no-git-tag-version)

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: bump version to $NEW [skip ci]"
            git tag "$NEW"
            git push origin develop "$NEW"
            echo "New version: $NEW ($TYPE)" >> "$GITHUB_STEP_SUMMARY"